<!-- =============== START OF SLIDER REVOLUTION SECTION =============== -->
<section id="slider" class="full-slider">
    <div class="rev-slider-wrapper fullscreen-container overlay-gradient">
        <div id="fullscreen-slider" class="rev_slider fullscreenbanner rev-slider-hidden" data-version="5.4.1">
            <ul>

                <!-- ===== SLIDE NR. 1 ===== -->
                <li data-transition="fade">
                    <!-- MAIN IMAGE -->
                    <img src="assets/images/slider/slider1.jpg" alt="Image" title="slider-bg"
                        data-bgposition="center center" data-bgfit="cover" data-bgrepeat="no-repeat"
                        data-bgparallax="10" class="rev-slidebg" data-no-retina="">
                    <!-- LAYER NR. 1 -->
                    <div class="tp-caption tp-resizeme" data-x="center" data-hoffset="" data-y="middle"
                        data-voffset="['-30','-30','-30','-30']" data-responsive_offset="on"
                        data-fontsize="['60','50','40','30']" data-lineheight="['60','50','40','30']"
                        data-whitespace="nowrap"
                        data-frames='[{"delay":1000,"speed":2000,"frame":"0","from":"y:[100%];z:0;rX:0deg;rY:0;rZ:0;sX:1;sY:1;skX:0;skY:0;opacity:0;","mask":"x:0px;y:[100%];s:inherit;e:inherit;","to":"o:1;","ease":"Power2.easeInOut"},{"delay":"wait","speed":500,"frame":"999","to":"auto:auto;","ease":"Power3.easeInOut"}]'
                        class="tp-caption tp-resizeme rev-layer-title">START STREAMING NOW
                    </div>
                </li>

                <!-- ===== SLIDE NR. 2 ===== -->
                <li data-transition="fade" data-slotamount="7" data-easein="default" data-easeout="default"
                    data-masterspeed="2000">
                    <!-- MAIN IMAGE -->
                    <img src="assets/images/slider/slider2.jpg" alt="Image" title="slider-bg"
                        data-bgposition="center top" data-bgfit="cover" data-bgrepeat="no-repeat" data-bgparallax="10"
                        class="rev-slidebg" data-no-retina="">
                    <!-- LAYER NR. 1 -->
                    <div class="tp-caption tp-resizeme" data-x="center" data-hoffset="" data-y="middle"
                        data-voffset="['-30','-30','-30','-30']" data-responsive_offset="on"
                        data-fontsize="['60','50','40','30']" data-lineheight="['60','50','40','30']"
                        data-whitespace="nowrap"
                        data-frames='[{"delay":1000,"speed":2000,"frame":"0","from":"y:[100%];z:0;rX:0deg;rY:0;rZ:0;sX:1;sY:1;skX:0;skY:0;opacity:0;","mask":"x:0px;y:[100%];s:inherit;e:inherit;","to":"o:1;","ease":"Power2.easeInOut"},{"delay":"wait","speed":500,"frame":"999","to":"auto:auto;","ease":"Power3.easeInOut"}]'
                        class="tp-caption tp-resizeme rev-layer-title">ULTRA HD RESOLUTION
                    </div>
                </li>

                <!-- ===== SLIDE NR. 3 ===== -->
                <li data-transition="fade" data-slotamount="7" data-easein="default" data-easeout="default"
                    data-masterspeed="2000">
                    <!-- MAIN IMAGE -->
                    <img src="assets/images/slider/slider3.jpg" alt="Image" data-bgposition="center top"
                        data-bgfit="cover" data-bgrepeat="no-repeat" data-bgparallax="3" class="rev-slidebg"
                        data-no-retina>
                    <!-- LAYER NR. 1 -->
                    <div class="tp-caption tp-resizeme" data-x="center" data-hoffset="" data-y="middle"
                        data-voffset="['-30','-30','-30','-30']" data-responsive_offset="on"
                        data-fontsize="['60','50','40','30']" data-lineheight="['60','50','40','30']"
                        data-whitespace="nowrap"
                        data-frames='[{"delay":1000,"speed":2000,"frame":"0","from":"y:[100%];z:0;rX:0deg;rY:0;rZ:0;sX:1;sY:1;skX:0;skY:0;opacity:0;","mask":"x:0px;y:[100%];s:inherit;e:inherit;","to":"o:1;","ease":"Power2.easeInOut"},{"delay":"wait","speed":500,"frame":"999","to":"auto:auto;","ease":"Power3.easeInOut"}]'
                        class="tp-caption tp-resizeme rev-layer-title">LATEST MOVIES & SERIES
                    </div>
                </li>

            </ul>
        </div>
    </div>
    <!-- ===== END OF REV SLIDER WRAPPER ===== -->


    <!-- ===== START OF SEARCH FORM WRAPPER ===== -->
    <div class="search-form-wrapper search-form-rev">
        <div class="container">

            <!-- ===== START OF SEARCH FORM
            <form id="search-form-1">
                <div class="row justify-content-center">
                    <div class="col-md-8 col-sm-10 col-12">
                        <div class="form-group">
                            <input name="search-keyword" type="text" id="search-keyword" value="" class="form-control" placeholder="Enter Movies or Series Title">
                            <button type="submit" class="btn btn-main btn-effect"><i class="fa fa-search"></i></button>
                        </div>
                    </div>
                </div>
            </form>
             END OF SEARCH FORM ===== -->

        </div>
    </div>
    <!-- ===== END OF SEARCH FORM WRAPPER ===== -->
</section>

<!-- =============== START OF LATEST MOVIES SECTION =============== -->
<section class="latest-movies ptb100">
    <div class="container">
        <div class="row">
            <div class="col-md-12 text-center">
                <h2 class="title">Latest Movies</h2>
                <p class="subtitle">Check out the top movies from TMDB</p>
            </div>
        </div>

        <div class="row mt-5">
            <div class="col-lg-3 col-md-6 col-sm-12" *ngFor="let movie of latestMovies">
                <div class="movie-box-1 mb30">
                    <div class="poster">
                        <img [src]="getAbsolutePath(movie.imageurl)" alt="{{movie.name}}">
                    </div>
                    <div class="buttons">
                        <a [routerLink]="['/user/moviedetails', movie.id]" class="play-video" aria-label="Play video">
                            <i class="fa fa-play"></i>
                        </a>
                    </div>
                    <div class="movie-details">
                        <h4 class="movie-title">
                            <a [routerLink]="['/user/moviedetails', movie.id]">{{movie.name}}</a>
                        </h4>
                        <span class="released">{{ getReleaseDate(movie.releaseddate) }}</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
<!-- =============== END OF LATEST MOVIES SECTION =============== -->
